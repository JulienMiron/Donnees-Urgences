name: Collecte urgences

on:
  schedule:
    - cron: "20 * * * *"   # chaque heure, 20 min après l'heure (UTC)
  workflow_dispatch:        # permet un lancement manuel

permissions:
  contents: write

concurrency:
  group: collecte-urgences
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas requests

      - run: python collecter_urgences.py

      - name: Commit des nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || {
            git commit -m "Relevé urgences $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          }