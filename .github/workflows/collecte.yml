name: Collecte urgences

on:
  # La collecte planifiée est faite par collecte.sh sur le Mac.
  # Pour la réactiver sur GitHub, remettez :
  #   schedule:
  #     - cron: "20 * * * *"
  workflow_dispatch:        # lancement manuel seulement

permissions:
  contents: write

concurrency:
  group: collecte-urgences
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas requests

      - name: Relevé horaire du MSSS
        run: python collecter_urgences.py

      - name: Coordonnées des installations (une seule fois)
        run: test -f data/installations.csv || python coordonnees.py

      - name: Données du site
        run: python construire_site.py

      - name: Commit des nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          git diff --staged --quiet || {
            git commit -m "Relevé urgences $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --quiet
            git push
          }
